description: Sync SGX screener shareholders, commit the payload

# GitHub: .github/workflows/sync_screener_shareholders.yaml

container:
  image: sgx-buyback-runners:latest
  pull_policy: never
  working_dir: /workspace

secrets:
  - PROXY
  - SUPABASE_URL
  - SUPABASE_KEY

schedule: "0 8 1 * *"
queue: sgx-scraper-main
timeout_sec: 3600
hist_retention_days: 30

steps:
  - id: checkout
    run: runners clone

  - id: preflight
    depends: [checkout]
    run: bash .dagu/steps/preflight.sh

  - id: sync
    depends: [preflight]
    run: python -m sgx_scraper.main_cli sync_screener_shareholders

  - id: publish
    depends: [sync]
    run: >-
      runners push -m "sgx_shareholders: track shareholders payload"
