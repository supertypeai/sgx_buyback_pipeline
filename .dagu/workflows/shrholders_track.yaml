description: Track SGX shareholders into the database

# GitHub: .github/workflows/shareholders_tracking.yaml

container:
  image: sgx-buyback-runners:latest
  pull_policy: never
  working_dir: /workspace

secrets:
  - SUPABASE_URL
  - SUPABASE_KEY

schedule: "0 7 * * *"
queue: sgx-scraper-main
timeout_sec: 3600
hist_retention_days: 30

steps:
  - id: checkout
    run: runners clone

  - id: preflight
    depends: [checkout]
    run: bash .dagu/steps/preflight.sh

  - id: track
    depends: [preflight]
    run: python -m sgx_scraper.main_cli track_shareholders
