description: SGX upcoming dividends — scrape, push to the database, commit data/

# GitHub: .github/workflows/sgx_upcoming_dividend_scraper.yaml

container:
  image: sgx-buyback-runners:latest
  pull_policy: never
  working_dir: /workspace

secrets:
  - PROXY
  - SUPABASE_URL
  - SUPABASE_KEY

schedule: "0 18 * * 1-5"
queue: sgx-scraper-main
timeout_sec: 3600
hist_retention_days: 30

steps:
  - id: checkout
    run: runners clone

  - id: preflight
    depends: [checkout]
    run: bash .dagu/steps/preflight.sh chrome

  - id: scrape
    depends: [preflight]
    run: python -m sgx_scraper.main_cli upcoming_dividend

  - id: publish
    depends: [scrape]
    run: >-
      runners push -m "sgx_upcoming_dividend: scraped data and push"
