name: Track SGX Management

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * *" # 13:10 AM WIB (UTC+7)

concurrency:
  group: sgx-scraper-main
  cancel-in-progress: false
  queue: max 

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Run management tracking
        env:
          PROXY: ${{ secrets.PROXY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m sgx_scraper.main_cli track_management --is-push-db

      - name: Upload scraper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-management-tracking-artifacts
          path: scraper.log
          if-no-files-found: warn
          retention-days: 90
